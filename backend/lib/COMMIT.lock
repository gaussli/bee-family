## 3. 完整构建命令（在锁定的源码根目录执行）
# 3.1 首次在线自建（下载插件/依赖到独立本地仓库，不污染 ~/.m2）
export JAVA_HOME=/Library/Java/JavaVirtualMachines/jdk-17.jdk/Contents/Home
export PATH="$JAVA_HOME/bin:$PATH"
mvn -B -Dmaven.repo.local=<本机构建仓库> -DskipTests -Dmaven.compiler.release=17 package

# 3.2 推荐 T01 采用：固定 outputTimestamp，保证产物字节级可复现
mvn -B -DskipTests -Dmaven.compiler.release=17 \
    -Dproject.build.outputTimestamp=2026-05-12T05:00:40Z package

# 3.3 离线重复构建（本次已实测 EXIT=0 / BUILD SUCCESS）
mvn -o -B -Dmaven.repo.local=<本机构建仓库> -DskipTests -Dmaven.compiler.release=17 \
    -Dproject.build.outputTimestamp=2026-05-12T05:00:40Z clean package

# 3.4 T01 落地 vendor（本任务只在临时目录用等价手工布局验证，未写入仓库）
mvn install:install-file \
    -Dfile=openize-heic-26.5.1.jar -DpomFile=pom.xml \
    -DlocalRepositoryPath=backend/lib/maven-repo \
    -DgroupId=openize -DartifactId=openize-heic -Dversion=26.5.1 -Dpackaging=jar

